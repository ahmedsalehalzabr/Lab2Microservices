version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: program
      POSTGRES_PASSWORD: test
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  gateway:
    build: ./Gateway
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - order-service
      - warehouse-service

  user-service:
    build: ./UserService
    environment:
      - ASPNETCORE_URLS=http://+:8050
    depends_on:
      - postgres

  order-service:
    build: ./OrderService
    environment:
      - ASPNETCORE_URLS=http://+:8060
    depends_on:
      - postgres

  warehouse-service:
    build: ./WarehouseService
    environment:
      - ASPNETCORE_URLS=http://+:8070
    depends_on:
      - postgres

volumes:
  postgres_data:
